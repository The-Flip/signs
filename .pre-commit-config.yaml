# Pre-commit hooks configuration
# Install with: mise run bootstrap
# Run manually: mise run precommit
# See https://pre-commit.com for more information

# Binary-like files that must stay exactly as their source apps wrote them
exclude: ^(tests/fixtures|src/signs/fonts)/

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Prettier - Markdown formatter
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        types_or: [markdown]

  # Prevent commits to main
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Security checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^uv\.lock$

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.csv$|\.md$'
      - id: end-of-file-fixer
        exclude: '\.csv$|\.md$'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '\.csv$'

  - repo: local
    hooks:
      # Type checking - runs mypy from the project environment with all dependencies
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # Regenerate agent docs when source or build script changes
      - id: agent-docs
        name: agent-docs
        entry: bash -c 'uv run python scripts/build_agent_docs.py && git add CLAUDE.md AGENTS.md'
        language: system
        files: ^(docs/AGENTS\.src\.md|scripts/build_agent_docs\.py)$
        pass_filenames: false

      # Block direct edits to generated agent docs (unless source or script also changed)
      - id: agent-docs-no-direct-edit
        name: agent-docs-no-direct-edit
        entry: scripts/check_agent_docs_edit.sh
        language: system
        files: ^(CLAUDE|AGENTS)\.md$
        exclude: ^docs/
        stages: [pre-commit]

      # Run tests before push
      - id: pytest
        name: pytest
        entry: uv run pytest -m ''
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
