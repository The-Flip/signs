[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "signs"
version = "0.1.0"
description = "Sign management and printing for The Flip museum"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "pypdf>=7.0.0",
    "typer>=0.28.0",
]

[project.scripts]
signs = "signs.cli:app"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]    # Allow asserts in tests
"scripts/*.py" = ["T201"]  # Allow print in build scripts
"src/signs/tools.py" = ["S603"]  # Allow subprocess for trusted binaries resolved with shutil.which

[tool.ruff.lint.isort]
known-first-party = ["signs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

# Only exists inside Scribus's own Python
[[tool.mypy.overrides]]
module = "scribus"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration'"
markers = ["integration: needs Inkscape, Scribus and xvfb (run with `mise run test-all`)"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
]
